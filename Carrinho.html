
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho | PetShop Minac</title>
    <link rel="stylesheet" href="carrinho.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="logo.jpg" alt="PetShop Minac" width="75">
        </div>

        <h1>Carrinho</h1>

        <div class="header-actions">
            <button class="edit-button" type="button">Editar</button>

            <button class="chat-button" type="button" aria-label="Abrir atendimento">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

    </header>

    <main class="container">

        <section class="cart-section">

            <div id="cart-products"></div>

            <button class="coupon-link" type="button">
                <span class="coupon-icon">%</span>
                Adicionar o código do cupom de loja
            </button>

            <section class="discount-section">

                <h2>
                    <span class="coupon-icon">%</span>
                    Cupons de Desconto
                </h2>

                <div class="coupon-entry" hidden>

                    <input
                        type="text"
                        id="coupon-input"
                        placeholder="Digite o cupom da loja"
                        aria-label="Código do cupom"
                    >

                    <button type="button" id="apply-coupon">
                        Aplicar
                    </button>

                    <p id="coupon-message"></p>

                </div>

            </section>

            <label class="select-all">
                <input type="checkbox" id="select-all">
                <span>Tudo</span>
            </label>

        </section>

        <aside class="checkout-section">

            <div class="checkout-bottom">

                <div class="total">
                    <strong>Subtotal:</strong>
                    <span id="cart-subtotal">R$ 0,00</span>
                </div>

                <button class="continue-button" type="button">
                    Continuar
                </button>

                <label class="pickup-option">
                    <input type="checkbox" id="pickup-store">
                    Retirar na loja (frete grátis)
                </label>

            </div>

        </aside>

    </main>

    <script src="carrinho.js"></script>

</body>
</html>
